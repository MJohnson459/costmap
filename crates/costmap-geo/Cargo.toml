[package]
name = "costmap-geo"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Turn OpenDroneMap orthophoto, DSM and DTM rasters, or a ROS map, into a navigation cost GeoTIFF"
repository = "https://github.com/MJohnson459/costmap"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
costmap = { path = "../..", features = ["geotiff"] }
glam = "0.33"
serde_json = "1.0"
thiserror = "2.0"
tiff = "0.11"

[dev-dependencies]
tempfile = "3"
