[workspace]
name = "costmap-ros-nav2"
channels = ["robostack-lyrical", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
ros-lyrical-nav2-costmap-2d = ">=1.5.2,<2"
ros-lyrical-nav2-msgs = ">=1.5.2,<2"
ros-lyrical-nav2-planner = ">=1.5.2,<2"
ros-lyrical-nav2-navfn-planner = ">=1.5.2,<2"
ros-lyrical-nav2-controller = ">=1.5.2,<2"
ros-lyrical-nav2-regulated-pure-pursuit-controller = ">=1.5.2,<2"
ros-lyrical-nav2-bt-navigator = ">=1.5.2,<2"
ros-lyrical-nav2-lifecycle-manager = ">=1.5.2,<2"
ros-lyrical-nav2-bringup = ">=1.5.2,<2"
ros-lyrical-rmw-zenoh-cpp = "*"
ros-lyrical-tf2-ros = "*"
ros-lyrical-rclpy = "*"
ros-lyrical-ros2run = "*"
ros-lyrical-ros2lifecycle = "*"
numpy = "*"
pillow = "*"
pyyaml = "*"

[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"

# The tools test/colcon.sh builds the package with, without Nav2.
[feature.build.dependencies]
colcon-common-extensions = "*"
ros-lyrical-ament-cmake = "*"
ros-lyrical-ros2run = "*"
ros-lyrical-ros2pkg = "*"
ros-lyrical-ros2launch = "*"
ros-lyrical-launch-ros = "*"
ros-lyrical-rmw-zenoh-cpp = "*"
cmake = "*"
make = "*"
rust = ">=1.92"
c-compiler = "*"

[environments]
build = { features = ["build"], no-default-feature = true }
