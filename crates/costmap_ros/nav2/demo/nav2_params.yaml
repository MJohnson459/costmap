# Nav2 for the drive demo: planner, controller and behaviour tree navigator.
# costmap_window_server supplies the route across the whole map; Nav2's
# planner plans the 15 m ahead on it inside the global costmap. Both costmaps
# hold only what costmap_window_server publishes on /map, plus inflation. There
# is no sensor layer.
#
# demo/run.sh overrides `resolution` in both costmaps from the map, and the
# behaviour tree path.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_name_prefixes:
      - compute_path
      - follow_path

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      # Cells outside the survey are unknown and must not be driven on.
      allow_unknown: false

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    odom_topic: odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandler"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.3
      # The mission only needs the robot to arrive; heading is free.
      yaw_goal_tolerance: 3.15
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 3.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 1.0
      lookahead_dist: 0.9
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.5
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Not rolling: the static layer resizes the costmap to each window the
      # server publishes, as it does for a map that grows under SLAM, and the
      # costmap is recomputed only then.
      rolling_window: false
      resolution: 0.05
      robot_radius: 0.3
      update_frequency: 1.0
      publish_frequency: 0.5
      always_send_full_costmap: true
      track_unknown_space: true
      trinary_costmap: false
      lethal_cost_threshold: 100
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.3
      update_frequency: 10.0
      publish_frequency: 2.0
      always_send_full_costmap: true
      track_unknown_space: true
      trinary_costmap: false
      lethal_cost_threshold: 100
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: ["planner_server", "controller_server", "bt_navigator"]
