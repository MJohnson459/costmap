# Nav2 holding the whole map, for bench/run.sh: map_server publishes it and
# planner_server plans on a global costmap that covers all of it.
#
# bench/run.sh sets map_server's yaml_filename.

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 30.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Sized by the static layer to the map it receives.
      rolling_window: false
      robot_radius: 0.3
      update_frequency: 1.0
      publish_frequency: 0.0
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

lifecycle_manager:
  ros__parameters:
    autostart: true
    bond_timeout: 0.0
    node_names: ["map_server", "planner_server"]
