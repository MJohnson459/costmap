[package]
name = "costmap_ros"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Serves Nav2 a rolling window of a large map and routes across the whole of it, over Zenoh"
repository = "https://github.com/MJohnson459/costmap"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
costmap = { path = "../..", features = ["geotiff"] }
ctrlc = { version = "3", features = ["termination"] }
glam = "0.33"
hiroz = { version = "0.2.1", default-features = false, features = ["lyrical", "rmw-zenoh"] }
hiroz-msgs = { version = "0.2.1", default-features = false, features = ["lyrical", "nav_msgs", "tf2_msgs"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Used by the message types build.rs generates into nav2_msgs.
bytemuck = "1"
byteorder = "1"
hiroz-cdr = "0.2.1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
anyhow = "1"
hiroz-codegen = "0.2.1"

[dev-dependencies]
tempfile = "3"
approx = { version = "0.5.1", default-features = false }

# Code generated by hiroz-codegen tests a feature of hiroz-msgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python_registry"))'] }
