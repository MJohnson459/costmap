[package]
name = "costmap"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "2D costmaps, occupancy grids, and raycasting for robotics navigation - a Nav2 alternative in pure Rust"
repository = "https://github.com/MJohnson459/costmap"
keywords = ["costmap", "occupancy-grid", "raycasting", "robotics", "nav2"]
categories = ["science", "algorithms", "simulation"]

[dependencies]
bitvec = "1.0"
glam = "0.33"
image = "0.25"
rerun = { version = "0.34", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
tiff = { version = "0.11", optional = true }

[dev-dependencies]
criterion = "0.8"
approx = { version = "0.5.1", default-features = false }
serde_json = "1.0"

[features]
default = []
rerun = ["dep:rerun"]
geotiff = ["dep:tiff"]

[profile.release]
debug = true

# The farm_demo smoke test simulates a full drive, which takes over a minute unoptimised.
[profile.test]
opt-level = 1

[[example]]
name = "footprint_checking"
path = "examples/footprint_checking.rs"
required-features = ["rerun"]

[[example]]
name = "local_costmap_lidar"
path = "examples/local_costmap_lidar.rs"
required-features = ["rerun"]

[[example]]
name = "occupancy_raycast"
path = "examples/occupancy_raycast.rs"
required-features = ["rerun"]

[[example]]
name = "learned_traversability"
path = "examples/learned_traversability.rs"
required-features = ["rerun"]

[[example]]
name = "farm_demo"
path = "examples/farm_demo/main.rs"
required-features = ["rerun", "geotiff"]
test = true

[[bench]]
name = "load_warehouse"
harness = false

[[bench]]
name = "raycast"
harness = false

[[bench]]
name = "astar"
harness = false

[[bench]]
name = "line_iterator"
harness = false

[[bench]]
name = "resize_map"
harness = false

[[bench]]
name = "update_origin"
harness = false

[[bench]]
name = "inflation"
harness = false

[[bench]]
name = "tiled_window"
harness = false

[workspace]
members = [".", "crates/costmap-geo", "crates/costmap_ros"]
