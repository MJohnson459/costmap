name: Package

# Builds what a robot installs: the costmap_ros install prefix as a tarball for
# x86-64 and arm64, and the conda package for RoboStack. On a version tag the
# files are attached to that tag's GitHub release.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  prefix:
    name: Install prefix (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 gives the oldest glibc the binaries will need: 2.35.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the prefix
        run: bash crates/costmap_ros/package.sh dist

      - name: Run the programs
        run: |
          for program in costmap_window_server costmap_planner_server costmap-from-ros-map; do
            dist/costmap_ros/lib/costmap_ros/$program --help
          done

      - uses: actions/upload-artifact@v4
        with:
          name: costmap_ros-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  conda:
    name: Conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Build the package
        run: >
          pixi exec rattler-build build
          --recipe crates/costmap_ros/conda/recipe.yaml
          -c robostack-lyrical -c conda-forge
          --output-dir dist/conda

      - uses: actions/upload-artifact@v4
        with:
          name: costmap_ros-conda
          path: dist/conda/linux-64/*.conda
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prefix, conda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
