name: Package

# Builds what a robot installs: the Debian package for x86-64 and arm64, and
# the conda package for RoboStack. On a version tag the
# files are attached to that tag's GitHub release.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Debian package (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 gives the oldest glibc the binaries will need: 2.35.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/cargo"

      - name: Build the package
        run: |
          cmake -S crates/costmap_ros -B build -DCOSTMAP_ROS_STANDALONE=ON
          cmake --build build
          cd build && cpack

      - name: Run the programs
        run: |
          dpkg --info build/*.deb
          dpkg -x build/*.deb dist
          for program in tiled_map_server costmap-from-ros-map; do
            dist/opt/ros/lyrical/lib/tiled_map_server/$program --help
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tiled_map_server-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  conda:
    name: Conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Build the package
        run: >
          pixi exec rattler-build build
          --recipe crates/costmap_ros/conda/recipe.yaml
          -c robostack-lyrical -c conda-forge
          --output-dir dist/conda

      - uses: actions/upload-artifact@v4
        with:
          name: tiled_map_server-conda
          path: dist/conda/linux-64/*.conda
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, conda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check the tag is the packaged version
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' crates/costmap_ros/package.xml)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "tag $GITHUB_REF_NAME does not match package.xml version $version" >&2
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
